<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vectra-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vectra | Smart Link Hub</title>
    <meta name="description" content="Vectra Project" />
    <meta name="author" content="Vectra" />
    <meta property="og:title" content="Vectra" />
    <meta property="og:description" content="Vectra Project" />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
